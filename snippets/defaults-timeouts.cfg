# defaults: timeouts that close slow-client (Slowloris) holes
defaults
	timeout http-request    10s   # time to receive the complete request headers
	timeout http-keep-alive 10s   # idle time between requests on a kept-alive connection
	timeout connect         5s
	timeout client          60s
	timeout server          60s
	timeout tunnel          1h    # websockets / CONNECT, only after the upgrade
	timeout queue           30s
	option  http-buffer-request   # also apply http-request timeout to the body of POSTs
